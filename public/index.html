<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f26b3a">
  <title>まちあわせ</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">📍 まちあわせ</a>
  </header>

  <main id="app">
    <!-- ホーム: まちあわせ作成 -->
    <section id="view-home" class="view" hidden>
      <div class="hero">
        <h1>リンクを送るだけで、<br>待ち合わせがラクになる。</h1>
        <p>場所と時間を決めて共有。みんなの「いまどこ？」「あと何分？」がひと目でわかります。登録不要。</p>
      </div>
      <form id="create-form" class="card">
        <label>タイトル
          <input name="title" maxlength="60" placeholder="例: 金曜の飲み会" required>
        </label>
        <label>場所
          <input name="place" maxlength="100" placeholder="例: 渋谷駅 ハチ公前" required>
        </label>
        <label>日時
          <input name="time" type="datetime-local" required>
        </label>
        <label>メモ（任意）
          <textarea name="note" maxlength="300" rows="2" placeholder="例: 改札出て左の柱のあたり"></textarea>
        </label>
        <div class="field">
          <div class="field-head">
            <span>地図で場所を指定（任意）</span>
            <button type="button" id="pick-here" class="btn-link">現在地を使う</button>
          </div>
          <div id="pick-map" class="map map-small"></div>
          <p class="hint" id="pick-hint">地図をタップするとピンを置けます</p>
        </div>
        <button class="btn btn-primary" type="submit">まちあわせを作る</button>
      </form>
      <div id="recent" class="card" hidden>
        <h2>最近のまちあわせ</h2>
        <ul id="recent-list" class="recent-list"></ul>
      </div>
    </section>

    <!-- まちあわせ画面 -->
    <section id="view-room" class="view" hidden>
      <div class="card room-head">
        <h1 id="room-title"></h1>
        <div class="room-meta">
          <div>🕒 <span id="room-time"></span></div>
          <div>📍 <span id="room-place"></span></div>
        </div>
        <p id="room-note" class="room-note" hidden></p>
        <div id="countdown" class="countdown"></div>
        <div class="row">
          <button id="share-btn" class="btn btn-primary">🔗 リンクを共有</button>
          <a id="route-btn" class="btn" target="_blank" rel="noopener">🧭 経路</a>
        </div>
      </div>

      <form id="join-form" class="card" hidden>
        <h2>参加する</h2>
        <label>あなたの名前
          <input name="name" maxlength="20" placeholder="例: たろう" required>
        </label>
        <button class="btn btn-primary" type="submit">参加</button>
      </form>

      <div id="me-panel" class="card" hidden>
        <div class="field-head">
          <h2><span id="me-name"></span> さんのステータス</h2>
          <button id="leave-btn" class="btn-link danger">抜ける</button>
        </div>
        <div id="status-buttons" class="chips"></div>
        <div class="eta-row">
          <span>到着まで</span>
          <div class="chips" id="eta-buttons"></div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="share-loc">
          <span>現在地をみんなに共有する</span>
        </label>
        <p class="hint" id="loc-hint"></p>
      </div>

      <div class="card">
        <h2>メンバー <span id="member-count" class="badge"></span></h2>
        <ul id="member-list" class="member-list"></ul>
      </div>

      <div class="card">
        <h2>地図</h2>
        <div id="room-map" class="map"></div>
      </div>

      <div class="card">
        <h2>チャット</h2>
        <ul id="messages" class="messages"></ul>
        <form id="msg-form" class="msg-form" hidden>
          <input name="text" maxlength="300" placeholder="メッセージ" autocomplete="off" required>
          <button class="btn btn-primary" type="submit">送信</button>
        </form>
        <div class="quick" id="quick-msgs" hidden></div>
      </div>
    </section>

    <section id="view-missing" class="view card" hidden>
      <h1>まちあわせが見つかりません</h1>
      <p>リンクが間違っているか、期限が切れて削除されました。</p>
      <a href="/" class="btn btn-primary">新しく作る</a>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
